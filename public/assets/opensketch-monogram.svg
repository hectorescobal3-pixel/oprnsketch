<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="monoSlateOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6D8C"/>
      <stop offset="50%" stop-color="#3D5A73"/>
      <stop offset="100%" stop-color="#223342"/>
    </linearGradient>
    <linearGradient id="monoSlateInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#354E63"/>
      <stop offset="100%" stop-color="#1E2B37"/>
    </linearGradient>
    <linearGradient id="monoSGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="50%" stop-color="#D9DEE4"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>
  </defs>

  <!-- Outer Technical Ring Segments (O) -->
  <circle cx="60" cy="60" r="52" stroke="url(#monoSlateOuter)" stroke-width="7" stroke-linecap="round" stroke-dasharray="235 25 55 12"/>
  
  <!-- Secondary Concentric Track (Blue Slate) -->
  <circle cx="60" cy="60" r="43" stroke="url(#monoSlateInner)" stroke-width="5" stroke-linecap="round" stroke-dasharray="160 20 80 14" opacity="0.9"/>
  
  <!-- Fine Inner Orbit Track -->
  <circle cx="60" cy="60" r="34" stroke="#3D5A73" stroke-width="2.5" stroke-dasharray="45 12 35 18" opacity="0.6"/>

  <!-- Central Interlocking S Structure (Silver High-Contrast #D9DEE4) -->
  <path d="M80 41 
           C75 33, 51 31, 42 40
           C33 49, 34 60, 58 63
           C80 67, 86 78, 76 89
           C65 100, 42 98, 35 88" 
        fill="none" 
        stroke="url(#monoSGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Technical Accent Notch Lines -->
  <line x1="28" y1="60" x2="38" y2="60" stroke="#D9DEE4" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="60" x2="92" y2="60" stroke="#4A6D8C" stroke-width="3" stroke-linecap="round"/>
</svg>
