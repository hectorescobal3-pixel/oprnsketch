<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="slateGradOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6D8C"/>
      <stop offset="50%" stop-color="#3D5A73"/>
      <stop offset="100%" stop-color="#223342"/>
    </linearGradient>
    <linearGradient id="slateGradInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#354E63"/>
      <stop offset="100%" stop-color="#1E2B37"/>
    </linearGradient>
    <linearGradient id="silverSGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="50%" stop-color="#D9DEE4"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>
  </defs>

  <!-- ================= MONOGRAM O+S (X: 10 to 110, Y: 10 to 110) ================= -->
  <g id="monogram" transform="translate(10, 10)">
    <!-- Outer Technical Ring Segments -->
    <circle cx="50" cy="50" r="46" stroke="url(#slateGradOuter)" stroke-width="6" stroke-linecap="round" stroke-dasharray="210 20 50 10"/>
    
    <!-- Secondary Concentric Track (Blue Slate) -->
    <circle cx="50" cy="50" r="38" stroke="url(#slateGradInner)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="140 18 70 12" opacity="0.9"/>
    
    <!-- Fine Inner Orbit Track -->
    <circle cx="50" cy="50" r="30" stroke="#3D5A73" stroke-width="2" stroke-dasharray="40 10 30 15" opacity="0.6"/>

    <!-- Central Interlocking S Structure (Silver High-Contrast #D9DEE4) -->
    <path d="M68 33 
             C63 26, 42 24, 34 32
             C26 40, 27 50, 48 53
             C68 56, 73 66, 64 76
             C54 86, 34 84, 28 75" 
          fill="none" 
          stroke="url(#silverSGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Technical Accent Notch Lines -->
    <line x1="22" y1="50" x2="30" y2="50" stroke="#D9DEE4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="50" x2="78" y2="50" stroke="#4A6D8C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ================= WORDMARK "opensketch" ================= -->
  <g id="wordmark" transform="translate(135, 73)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="44" 
          font-weight="400" 
          letter-spacing="-0.03em" 
          fill="#D9DEE4">opensketch</text>
  </g>
</svg>
