version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opensketch-postgres
    restart: always
    environment:
      POSTGRES_DB: opensketch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./database/migrations/001_initial_schema_and_rls.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - opensketch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opensketch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opensketch-redis
    restart: always
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - opensketch_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opensketch_pgdata:
  opensketch_redisdata:
